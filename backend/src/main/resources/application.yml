spring:
  application:
    name: wayfinder
  config:
    # Reads the project-root .env whether the app is started from backend/ or the repo root
    import: optional:file:.env[.properties],optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:wayfinder}
    username: ${POSTGRES_USER:wayfinder}
    password: ${POSTGRES_PASSWORD:wayfinder}

  jpa:
    # Schema is owned by Flyway; Hibernate only checks that entities match it
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      # Loads lazy collections (e.g. opening hours of a page of places) in batches instead of one query each
      hibernate.default_batch_fetch_size: 50

  flyway:
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  cache:
    type: redis
    redis:
      time-to-live: 15m

  # User photo uploads (photo/PhotoService): one file of at most 12 MB per request
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 13MB

  # SMTP for password reset e-mails. Empty MAIL_HOST = e-mails are not sent (see nomi.mail.dev-log-codes)
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000

server:
  error:
    include-message: never
  # Behind Caddy: the client's address comes from X-Forwarded-For (Tomcat trusts only private proxy addresses),
  # so rate limits count each guest, not the proxy
  forward-headers-strategy: native

logging:
  pattern:
    # Adds the request id (set by RequestIdFilter) to every log line
    level: "%5p [%X{requestId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    # An SMTP outage must not mark the whole app as down
    mail:
      enabled: false

nomi:
  timezone: Europe/Istanbul
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
    # The owner's accounts, comma separated: ADMIN when they register or sign in (admin area). Keep it in .env
    owner-emails: ${OWNER_EMAILS:}
    # https://localhost and capacitor://localhost are the Android / iOS app's WebView origins
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://localhost,capacitor://localhost}
  weather:
    base-url: ${WEATHER_BASE_URL:https://api.open-meteo.com}
    connect-timeout: 3s
    read-timeout: 5s
  ai:
    base-url: ${AI_SERVICE_URL:}
    # OpenAI-backed messages per user per day (Istanbul date); after that the rule-based parser answers
    daily-limit-per-user: ${AI_DAILY_LIMIT_PER_USER:150}
    api-key: ${AI_SERVICE_API_KEY:}
    connect-timeout: 2s
    read-timeout: 10s
  # OpenAI spending (admin area "Yapay zekâ"): list prices in USD per 1M tokens of OPENAI_MODEL (defaults: gpt-4.1-mini)
  ai-usage:
    input-price-per-million: ${AI_PRICE_INPUT_PER_MILLION:0.40}
    output-price-per-million: ${AI_PRICE_OUTPUT_PER_MILLION:1.60}
    # Our own lock under the OpenAI project limit; 0 = none
    monthly-budget-usd: ${AI_MONTHLY_BUDGET_USD:10}
  billing:
    dev-mode: ${BILLING_DEV_MODE:false}
    google-play-package-name: ${GOOGLE_PLAY_PACKAGE_NAME:com.nomi.app}
    google-play-service-account-file: ${GOOGLE_PLAY_SERVICE_ACCOUNT_FILE:}
    prices:
      DAILY: ${PRICE_DAILY_TRY:25}
      WEEKLY: ${PRICE_WEEKLY_TRY:79}
      MONTHLY: ${PRICE_MONTHLY_TRY:199}
      YEARLY: ${PRICE_YEARLY_TRY:1499}
    # Comma separated accounts with unlimited free access (e.g. the owner). Keep it only in .env
    free-access-emails: ${FREE_ACCESS_EMAILS:}
  mail:
    from: ${MAIL_FROM:Nomi <no-reply@nomi.app>}
    dev-log-codes: ${MAIL_DEV_LOG_CODES:false}
  rate-limit:
    # Requests per minute per user for expensive endpoints (route planning, assistant)
    requests-per-minute: 30
  places:
    # Realism cleanup of the places already in the database after every startup (osm/PlaceRealismCleanup); it has run
    # once, now only on demand: POST /api/v1/admin/places/cleanup
    cleanup-on-startup: false
  routes:
    # Unfinished routes of past days -> EXPIRED, at 00:05 (Istanbul time) and once after startup (RouteExpiryJob)
    expire-cron: 0 5 0 * * *
  google-places:
    # Places API (New) key: the place page asks Google whether a place is still there (closed for good -> hidden).
    # Empty = no check: "Google Haritalar'da aç" searches the name around our pin
    api-key: ${GOOGLE_PLACES_API_KEY:}
    radius-meters: 300
    timeout: 5s
  osm-pbf:
    # OpenStreetMap from a Geofabrik extract of Türkiye instead of the Overpass API: all 81 cities in minutes, no
    # rate limits; Geofabrik publishes it daily. Download download.geofabrik.de/europe/turkey-latest.osm.pbf
    # (~650 MB; it redirects to turkey-YYMMDD.osm.pbf) and point path to it; it is prepared once into cache-path
    # (rebuilt when the file changes)
    enabled: ${OSM_PBF_ENABLED:false}
    path: ${OSM_PBF_PATH:}
    cache-path: ${OSM_PBF_CACHE_PATH:}
    memory-limit: ${OSM_PBF_MEMORY_LIMIT:2GB}
  osm:
    # Cities of Turkey from OpenStreetMap, city by city. After startup, in the background: the 81 provinces when
    # they are missing, then every selected city that was never imported (Istanbul first, then by population)
    import-on-startup: ${OSM_IMPORT_ON_STARTUP:true}
    # Monthly refresh of all selected cities: 04:30 on the 1st (Istanbul time). "-" disables it
    refresh-cron: ${OSM_REFRESH_CRON:0 30 4 1 * *}
    # "all" or comma separated city slugs, e.g. "istanbul,ankara,izmir"
    cities: ${OSM_CITIES:all}
    # Pause between two Overpass calls of the city-by-city import
    call-delay: ${OSM_CALL_DELAY:10s}
    # Cities imported more recently than this are skipped by non-forced runs (resume after a restart / failure)
    refresh-after: ${OSM_REFRESH_AFTER:20d}
    # z.overpass-api.de first: the most reliable of overpass-api.de's servers in Sept 2026; lz4. and the main address next
    overpass-endpoints: ${OSM_OVERPASS_ENDPOINTS:https://z.overpass-api.de/api/interpreter,https://overpass-api.de/api/interpreter,https://lz4.overpass-api.de/api/interpreter,https://overpass.private.coffee/api/interpreter,https://overpass.kumi.systems/api/interpreter}
    connect-timeout: 15s
    # The Istanbul place query takes 1-3 minutes on the server side (the provinces query ~15 s)
    read-timeout: 5m
    max-attempts: 3
    retry-delay: 30s
  overture:
    # Food places (restaurants, cafés, breakfast, desserts) from Overture Maps (Foursquare, Meta, Microsoft) next to
    # OpenStreetMap: new places OSM lacks, and OSM food places no source knows any more are left out (likely closed)
    enabled: ${OVERTURE_ENABLED:true}
    # After startup, in the background: every city with OSM places that was never imported from Overture
    import-on-startup: ${OVERTURE_IMPORT_ON_STARTUP:true}
    # Overture publishes monthly (3rd / 4th week): 05:30 on the 28th re-imports cities on an older release
    refresh-cron: ${OVERTURE_REFRESH_CRON:0 30 5 28 * *}
    catalog-url: https://stac.overturemaps.org/catalog.json
    data-url: s3://overturemaps-us-west-2/release/%s/theme=places/type=place/*
    # Places below this certainty are not added: 0.5-0.7 brought closed / misplaced places in Çayırova
    # ("Çayırova Kızılay Çay Bahçesi" 0.67, "Gebze Pusula Cafe" 0.65 do not exist), Oct 2026
    min-confidence: ${OVERTURE_MIN_CONFIDENCE:0.7}
    memory-limit: ${OVERTURE_MEMORY_LIMIT:1GB}
    city-delay: 5s
  images:
    # One free-licensed Wikimedia Commons photo per place (from OSM's wikidata / wikimedia_commons / image tags)
    resolve-after-import: ${IMAGES_RESOLVE_AFTER_IMPORT:true}
    # Daily pass at 05:15 (Istanbul time) for places not checked yet or checked > recheck-after ago. "-" disables it
    resolve-cron: ${IMAGES_RESOLVE_CRON:0 15 5 * * *}
    recheck-after: 30d
    max-places-per-run: 5000
    wikidata-api-url: https://www.wikidata.org/w/api.php
    commons-api-url: https://commons.wikimedia.org/w/api.php
    thumb-width: 800
    connect-timeout: 10s
    read-timeout: 30s
    batch-delay: 1s
    max-attempts: 3
    retry-delay: 10s
    # Back off when Wikimedia's servers lag (seconds; 0 = not sent). Wikidata's maxlag also counts its
    # query service lag (often > 5 s for hours), which would block these read-only requests, so it is not sent there
    wikidata-maxlag: 0
    commons-maxlag: 5
  popularity:
    # Real-world interest per place from open Wikimedia signals (Wikidata sitelinks + Wikipedia pageviews)
    update-after-import: ${POPULARITY_UPDATE_AFTER_IMPORT:true}
    # Monthly pass over every city at 05:45 on the 2nd (Istanbul time). "-" disables it
    cron: ${POPULARITY_CRON:0 45 5 2 * *}
    recheck-after: 25d
    max-places-per-run: 20000
    # Days of Wikipedia pageviews summed (the API allows at most 60)
    pageview-days: 60
    wikidata-api-url: https://www.wikidata.org/w/api.php
    # {lang} = tr / en; query&prop=pageviews answers for 50 articles per request
    wikipedia-api-url: https://{lang}.wikipedia.org/w/api.php
    connect-timeout: 10s
    read-timeout: 30s
    batch-delay: 1s
    max-attempts: 3
    retry-delay: 30s
  photos:
    # User photos of places / districts, re-encoded JPEGs without metadata (production: a Docker volume that
    # Caddy serves under /media/photos; development: served by Spring under /media/photos)
    storage-dir: ${PHOTOS_STORAGE_DIR:./data/photos}
    # URL prefix in API answers. Production: the absolute URL (https://DOMAIN/media/photos) so the app can load them
    public-base: ${PHOTOS_PUBLIC_BASE:/media/photos}
    # Approved photos kept per place / district; older ones are deleted
    keep-per-target: 10
    daily-uploads-per-user: ${PHOTOS_DAILY_UPLOADS_PER_USER:10}
    daily-uploads-per-target: 3
    # Moderation + vision model in the AI service
    ai-read-timeout: 60s
    # Photos still PENDING after 10 minutes are checked again this often (AI service down, restart, ...)
    retry-interval: PT5M
    # Nightly: files of rejected photos after 7 days, their rows after 30 days, orphan files. "-" disables it
    cleanup-cron: ${PHOTOS_CLEANUP_CRON:0 40 3 * * *}
