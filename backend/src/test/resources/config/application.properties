# Test-only overrides, loaded on top of src/main/resources/application.yml.
# Tests must never download places from the Overpass API.
nomi.osm.import-on-startup=false
nomi.osm.refresh-cron=-
# ...nor from Wikidata / Wikimedia Commons (place photos)
nomi.images.resolve-after-import=false
nomi.images.resolve-cron=-
# ...and never write user photos into the working directory
nomi.photos.storage-dir=target/test-photos
nomi.photos.cleanup-cron=-
# ...nor place popularity from Wikidata / Wikimedia pageviews
nomi.popularity.update-after-import=false
nomi.popularity.cron=-
# The realism cleanup of existing places runs only in the app
nomi.places.cleanup-on-startup=false
# ...nor food places from Overture Maps (S3)
nomi.overture.enabled=false
nomi.overture.import-on-startup=false
nomi.overture.refresh-cron=-
