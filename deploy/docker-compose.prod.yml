# Production stack: Caddy (HTTPS) -> backend -> PostgreSQL/PostGIS, Redis, AI service.
# Only Caddy is reachable from outside (ports 80/443); everything else stays on the internal network.
#
#   cd deploy
#   cp .env.prod.example .env      # fill in
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  ai-service:
    build: ../ai-service
    restart: unless-stopped
    env_file: .env

  backend:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AI_SERVICE_URL: http://ai-service:8000
      GOOGLE_PLAY_SERVICE_ACCOUNT_FILE: /run/secrets/play-service-account.json
      # Real client IPs from Caddy (rate limiting per IP)
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    volumes:
      - ./secrets/play-service-account.json:/run/secrets/play-service-account.json:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend

volumes:
  db-data:
  redis-data:
  caddy-data:
  caddy-config:
