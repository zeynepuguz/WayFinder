services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: wayfinder-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wayfinder}
      POSTGRES_USER: ${POSTGRES_USER:-wayfinder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wayfinder}
    ports:
      # Local PostgreSQL 14 already uses 5432
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wayfinder-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
